
name: NPTELPicker CI

on:
  push:
    branches:
      - main
      - feature/day12-ci

  pull_request:
    branches:
      - main

jobs:
  quality-and-test:
    name: Code Quality and Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff pytest

      - name: Run Ruff
        run: python -m ruff check app tests ui

      - name: Run Pytest
        env:
          GEMINI_API_KEY: ci-test-placeholder
        run: python -m pytest -q

      - name: Build Docker image
        run: docker build -t nptelpicker:ci .
